<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>Let Chat Cook — Twitch Chat Restaurant Game</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: var(--bg, #1a1512); }
      /* Controller page: neutralise the game's fixed-width desktop root layout */
      body.is-controller { background: #12100e; overflow: auto; }
      body.is-controller #root {
        width: 100%; height: auto;
        transform: none; transform-origin: unset;
        position: static; left: auto; margin-left: 0;
        overflow: visible;
      }
      #root {
        width: 1440px;
        height: var(--app-height, 100vh);
        transform: scale(var(--app-scale, 1));
        transform-origin: top center;
        position: absolute;
        left: 50%;
        margin-left: -720px;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
